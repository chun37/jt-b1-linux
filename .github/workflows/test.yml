name: PC tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install host dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential fonts-noto-cjk linux-libc-dev
      - name: Install Pillow
        run: python -m pip install -r requirements.txt
      - name: Test Python and C, compile sources and check shell syntax
        run: make check
      - name: Render an offline home screen
        run: python tools/render_home.py --output /tmp/jtb1-home-ci.png
